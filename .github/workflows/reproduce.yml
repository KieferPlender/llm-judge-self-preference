name: Reproduce results

# Regenerates the reported metrics from the committed data (no API keys needed)
# and fails if they differ from the committed result files.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch keeps the install small; sentence-transformers needs it.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Regenerate results
        run: |
          python scripts/04_analysis/calculate_per_model_intervention_effects.py
          python scripts/06_reporting/verify_all_results.py
          python scripts/06_reporting/statistical_significance_rigorous.py
          python scripts/06_reporting/conference_plots.py

      - name: Check metrics match the committed results
        # Plots are excluded: PNG bytes vary with matplotlib and font versions.
        run: |
          git status --short
          git diff --exit-code -- results/metrics
